[book]
title = "Big O Notebook"
authors = ["Axeloooo"]
language = "en"
src = "src"

[preprocessor.tabs]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
additional-css = ["theme/tabs.css", "theme/reading.css"]
additional-js  = ["theme/tabs.js", "theme/reading.js", "mermaid.min.js", "mermaid-init.js"]
mathjax-support = true
git-repository-url = "https://github.com/Axeloooo/big-o-notebook"
edit-url-template = "https://github.com/Axeloooo/big-o-notebook/edit/devel/{path}"
